[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"
markers = ["local_http: allow HTTP only to a local test server"]

[tool.coverage.run]
source = ["custom_components.terneo"]
branch = true

[tool.coverage.report]
fail_under = 92
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
